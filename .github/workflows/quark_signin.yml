name: 夸克网盘每日签到

on:
  schedule:
    # GitHub Actions 使用 UTC 时间，北京时间 = UTC + 8。
    - cron: "0 17 * * *" # UTC 17:00 = 北京时间次日 01:00
    - cron: "0 21 * * *" # UTC 21:00 = 北京时间次日 05:00，失败兜底
  workflow_dispatch:
    inputs:
      force:
        description: "忽略今日已签到标记，强制重新执行一次签到（用于验证推送或手动补跑）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quark-signin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取北京时间日期
        id: date
        shell: bash
        run: |
          today=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "北京时间：$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S') (CST/UTC+8)"

      - name: 恢复今日运行次数
        id: run-count
        uses: actions/cache/restore@v6
        with:
          path: .cache/quark-run-count
          key: quark-runs-${{ steps.date.outputs.today }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            quark-runs-${{ steps.date.outputs.today }}-

      - name: 计算今日第几次运行
        id: count
        shell: bash
        run: |
          count_file=.cache/quark-run-count/count
          if [ -f "$count_file" ]; then
            count=$(cat "$count_file" 2>/dev/null || echo 0)
          else
            count=0
          fi
          # 缓存缺失或内容损坏时按 0 处理，避免非数字导致计算失败。
          case "$count" in
            ''|*[!0-9]*) count=0 ;;
          esac
          count=$((count + 1))
          mkdir -p .cache/quark-run-count
          echo "$count" > "$count_file"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: 打印运行时北京时间
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "0 17 * * *") slot="01:00（当天第 1 次计划运行）" ;;
            "0 21 * * *") slot="05:00（当天第 2 次计划运行，失败兜底）" ;;
            *) slot="非定时触发（手动或其它）" ;;
          esac
          echo "================ 运行时时间信息 ================"
          echo "北京时间 (Asia/Shanghai)：$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S %Z')"
          echo "UTC 时间　　　　　　　　：$(TZ='UTC' date +'%Y-%m-%d %H:%M:%S UTC')"
          echo "触发方式：${{ github.event_name }}"
          echo "计划槽位：${slot}"
          echo "今日运行次数：第 ${{ steps.count.outputs.count }} 次"
          echo "==============================================="

      - name: 恢复今日成功标记
        id: cache-success
        uses: actions/cache/restore@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}

      - name: 今日已完成签到
        if: steps.cache-success.outputs.cache-hit == 'true' && github.event.inputs.force != 'true'
        run: echo "今日已全部签到成功，跳过重复执行。"

      - name: 检出代码
        if: steps.cache-success.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        uses: actions/checkout@v7

      - name: 随机延迟
        if: steps.cache-success.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            max_delay=10
          else
            max_delay=60
          fi
          delay=$((RANDOM % (max_delay + 1)))
          echo "随机延迟 ${delay} 秒后开始执行。"
          sleep "$delay"

      - name: 设置 Python 环境
        if: steps.cache-success.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: steps.cache-success.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: 执行签到脚本
        if: steps.cache-success.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
          # 消息推送渠道：按需在仓库 Secrets 中配置，未配置的渠道不会启用。
          # Webhook 类变量支持多行，一次推送到多个群。
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SYNOLOGY_CHAT_URL: ${{ secrets.SYNOLOGY_CHAT_URL }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          GENERIC_WEBHOOK: ${{ secrets.GENERIC_WEBHOOK }}
          GENERIC_WEBHOOK_HEADERS: ${{ secrets.GENERIC_WEBHOOK_HEADERS }}
          NOTIFY_ENABLED: ${{ vars.NOTIFY_ENABLED }}
          NOTIFY_TIMEOUT: ${{ vars.NOTIFY_TIMEOUT }}
        run: python checkIn_Quark.py

      - name: 生成今日成功标记
        if: success() && steps.cache-success.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/quark-signin
          echo "${{ steps.date.outputs.today }}" > .cache/quark-signin/success

      - name: 保存今日成功标记
        if: success() && steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}

      - name: 保存今日运行次数
        # 即使签到失败也要记录“今天已经跑过几次”，所以用 always()；
        # count 未算出时（例如更早的步骤异常）跳过，避免保存空目录。
        if: always() && steps.count.outputs.count != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/quark-run-count
          key: quark-runs-${{ steps.date.outputs.today }}-${{ github.run_number }}-${{ github.run_attempt }}
