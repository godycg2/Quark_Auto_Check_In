name: 夸克网盘每日签到

on:
  schedule:
    - cron: "0 1 * * *" # 北京时间 09:00
    - cron: "0 5 * * *" # 北京时间 13:00，失败兜底
  workflow_dispatch:
    inputs:
      force:
        description: "忽略今日已签到标记，强制重新执行一次签到（用于验证推送或手动补跑）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quark-signin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取北京时间日期
        id: date
        shell: bash
        run: echo "today=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 恢复今日成功标记
        id: cache-success
        uses: actions/cache/restore@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}

      - name: 今日已完成签到
        if: steps.cache-success.outputs.cache-hit == 'true' && github.event.inputs.force != 'true'
        run: echo "今日已全部签到成功，跳过重复执行。"

      - name: 检出代码
        if: steps.cache-success.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        uses: actions/checkout@v7

      - name: 随机延迟
        if: steps.cache-success.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            max_delay=10
          else
            max_delay=60
          fi
          delay=$((RANDOM % (max_delay + 1)))
          echo "随机延迟 ${delay} 秒后开始执行。"
          sleep "$delay"

      - name: 设置 Python 环境
        if: steps.cache-success.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: steps.cache-success.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: 执行签到脚本
        if: steps.cache-success.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
          # 消息推送渠道：按需在仓库 Secrets 中配置，未配置的渠道不会启用。
          # Webhook 类变量支持多行，一次推送到多个群。
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SYNOLOGY_CHAT_URL: ${{ secrets.SYNOLOGY_CHAT_URL }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          GENERIC_WEBHOOK: ${{ secrets.GENERIC_WEBHOOK }}
          GENERIC_WEBHOOK_HEADERS: ${{ secrets.GENERIC_WEBHOOK_HEADERS }}
          NOTIFY_ENABLED: ${{ vars.NOTIFY_ENABLED }}
          NOTIFY_TIMEOUT: ${{ vars.NOTIFY_TIMEOUT }}
        run: python checkIn_Quark.py

      - name: 生成今日成功标记
        if: success() && steps.cache-success.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/quark-signin
          echo "${{ steps.date.outputs.today }}" > .cache/quark-signin/success

      - name: 保存今日成功标记
        if: success() && steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}
